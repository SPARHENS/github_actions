name: CI

on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
           - name: checkout files
             uses: actions/checkout@v4
            
           - name: setup python
             uses: actions/setup-python@v3
             with:
                python-version: 3.12.0
            
           - name: install dependencies
             run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
           - name: upload articact 1
             uses: actions/upload-artifact@v4
             with:
                name: build-data
                path: .
                retention-days: 1

    generate-test-data:
        runs-on: ubuntu-latest
        needs: build
        steps:
           - name: download artifact 1
             uses: actions/download-artifact@v4
             with:
                name: build-data
                path: .

           - name: generate json test data
             run: |
                python3 main.py
          
           - name: delete csv test data
             run: |
                rm -rf ${{ github.workspace }}/GITHUB_ACTIONS/test/data/*.csv
           - name: upload artifact 2
             uses: actions/upload-artifact@v4
             with:
                name: cleaned-test-data
                path: .
                retention-days: 1
    
    run-tests:
        runs-on: ubuntu-latest
        needs: generate-test-data
        steps:
           - name: download artifact 2
             uses: actions/download-artifact@v4
             with:
                name: cleaned-test-data
                path: .
           - name: run tests
             run: |
                pytest 